name: colyseus_flutter
description: Colyseus multiplayer game client for Flutter, backed by the native C SDK.
version: 0.18.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  meta: ^1.15.0

dev_dependencies:
  ffigen: ^14.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
