name: Swift Platform

on:
  push:
    paths:
      - 'platforms/swift/**'
      - 'src/**'
      - 'include/**'
      - 'third_party/**'
  pull_request:
    paths:
      - 'platforms/swift/**'
      - 'src/**'
      - 'include/**'
      - 'third_party/**'
  workflow_call:

jobs:
  build:
    name: Build xcframework and run tests
    # Pinned, not `latest`: Zig 0.15.2 needs a known Xcode, and every other
    # macOS job in this repo is pinned the same way.
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Show tool versions
        run: |
          zig version
          swift --version
          xcodebuild -version

      # macOS, iOS, iOS simulator, tvOS, tvOS simulator — and the
      # completeness check on the umbrella header runs as part of it.
      - name: Build xcframework (all slices)
        working-directory: platforms/swift
        run: bash build.sh release

      - name: Verify xcframework structure
        run: |
          echo "=== slices ==="
          ls platforms/swift/build/Colyseus.xcframework
          echo "=== the merged archive holds the whole closure ==="
          for symbol in _colyseus_monotonic_ms _colyseus_predict_tick _wslay_event_context_client_init _mbedtls_ssl_handshake; do
            found=$(nm -gU "platforms/swift/build/Colyseus.xcframework/macos-arm64_x86_64/libcolyseus.a" 2>/dev/null | grep -c " T $symbol$" || true)
            echo "$symbol: $found"
            if [ "$found" = "0" ]; then
              echo "missing $symbol — the slice merge dropped a library" >&2
              exit 1
            fi
          done
          echo "=== checksum ==="
          cat platforms/swift/build/Colyseus.xcframework.zip.sha256

      - name: Install example-server dependencies
        working-directory: example-server
        run: npm install

      - name: Start example server
        working-directory: example-server
        run: npx tsx src/index.ts > ../server.log 2>&1 &

      - name: Wait for the server
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:2567/matchmake/ > /dev/null 2>&1; then
              echo "server ready"
              exit 0
            fi
            sleep 2
          done
          echo "server never came up" >&2
          cat server.log
          exit 1

      # The prediction tests need the playground server, which lives in a
      # sibling checkout; they skip themselves with the command to start it.
      - name: Run Swift package tests
        working-directory: platforms/swift
        run: swift test

      - name: Build the example
        working-directory: platforms/swift/example
        run: swift build -c release

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@v4
        with:
          name: Colyseus.xcframework
          path: platforms/swift/build/Colyseus.xcframework.zip
