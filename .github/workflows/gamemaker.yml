name: GameMaker Extension Build

on:
  push:
    paths:
      - 'platforms/gamemaker/**'
    branches:
      - main
  pull_request:
    paths:
      - 'platforms/gamemaker/**'
  workflow_dispatch:

jobs:
  # Run test suite first (includes integration tests with example-server)
  test:
    uses: ./.github/workflows/tests.yml

  # Binding parity: every GM_EXPORT registered in the shim, the .yy function
  # lists, and matched by the GML call sites (gen-bindings.mjs --check).
  binding-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit binding parity
        run: node platforms/gamemaker/gen-bindings.mjs --check

      # The GML scripts are the API reference; any other doc that names a
      # function must name one that exists.
      - name: Docs name only functions the scripts define
        working-directory: platforms/gamemaker
        run: |
          defined=$( {
            perl -ne 'print "$1\n" while /\bfunction\s+(colyseus_\w+)\s*\(/g' example/BlankProject/scripts/Colyseus/Colyseus.gml example/BlankProject/scripts/ColyseusPredict/ColyseusPredict.gml
            perl -0777 -pe '1 while s/,(\s*[\]\}])/$1/g' example/BlankProject/extensions/Colyseus_SDK/Colyseus_SDK.yy | jq -r '.files[0].functions[] | .name, .externalName'
          } | sort -u)
          used=$(perl -ne 'print "$1\n" while /(?<![\w.])(colyseus_[a-z0-9_]+)\s*\(/g' *.md | sort -u)
          missing=$(comm -23 <(echo "$used") <(echo "$defined"))
          if [ -n "$missing" ]; then echo "docs reference undefined functions:"; echo "$missing"; exit 1; fi

      # No binaries here — this checks the script staging: every .gml the
      # wrapper needs ships, and nothing staged calls a function left behind.
      - name: Package scripts stage + resolves
        working-directory: platforms/gamemaker
        run: |
          ./package-yymps.sh
          unzip -l package-out/colyseus-gamemaker-*.yymps | grep -q 'scripts/Colyseus/Colyseus.gml'
          unzip -l package-out/colyseus-gamemaker-*.yymps | grep -q 'scripts/ColyseusPredict/ColyseusPredict.gml'

  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version-check.outputs.changed || 'true' }}
      version: ${{ steps.version-check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version changes
        uses: EndBug/version-check@v2
        id: version-check
        with:
          file-name: platforms/gamemaker/version.json
          diff-search: true

      - name: Log version info
        run: |
          echo "Version changed: ${{ steps.version-check.outputs.changed }}"
          echo "Version: ${{ steps.version-check.outputs.version }}"

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build macOS arm64
        working-directory: platforms/gamemaker
        run: zig build -Dtarget=aarch64-macos -Doptimize=ReleaseSafe

      - name: Build macOS x86_64
        working-directory: platforms/gamemaker
        run: zig build -Dtarget=x86_64-macos -Doptimize=ReleaseSafe

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-macos
          path: platforms/gamemaker/zig-out/lib/macos/

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build Linux x86_64
        working-directory: platforms/gamemaker
        run: zig build -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseSafe

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux
          path: platforms/gamemaker/zig-out/lib/linux/

  build-windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build Windows x86_64
        working-directory: platforms/gamemaker
        run: zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows
          path: platforms/gamemaker/zig-out/lib/windows/

  build-ios:
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build iOS arm64
        working-directory: platforms/gamemaker
        run: zig build -Dtarget=aarch64-ios -Doptimize=ReleaseSafe

      - name: Upload iOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-ios
          path: platforms/gamemaker/zig-out/lib/ios/

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Build Android arm64
        working-directory: platforms/gamemaker
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseSafe

      - name: Build Android arm32
        working-directory: platforms/gamemaker
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: zig build -Dtarget=arm-linux-androideabi -Doptimize=ReleaseSafe

      - name: Build Android x86_64
        working-directory: platforms/gamemaker
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: zig build -Dtarget=x86_64-linux-android -Doptimize=ReleaseSafe

      - name: Upload Android binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-android
          path: platforms/gamemaker/zig-out/lib/android/

  build-wasm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.23'

      - name: Verify emcc
        run: emcc --version

      - name: Build WASM
        working-directory: platforms/gamemaker
        run: |
          chmod +x build-wasm.sh
          ./build-wasm.sh ReleaseSmall

      - name: Upload WASM binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-wasm
          path: platforms/gamemaker/wasm-out/colyseus_wasm.js

  release:
    needs: [check-version, build-macos, build-ios, build-linux, build-windows, build-android, build-wasm]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts into zig-out/lib
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: platforms/gamemaker/zig-out/lib
          merge-multiple: false

      - name: Arrange artifacts into expected directory structure
        working-directory: platforms/gamemaker
        run: |
          # download-artifact creates binaries-<platform>/ subdirs
          # Restore platform prefix: binaries-macos/* → zig-out/lib/macos/*
          for dir in zig-out/lib/binaries-*/; do
            platform=$(basename "$dir" | sed 's/binaries-//')
            if [ "$platform" = "wasm" ]; then
              mkdir -p wasm-out
              cp "$dir"colyseus_wasm.js wasm-out/ 2>/dev/null || true
            else
              mkdir -p "zig-out/lib/$platform"
              cp -r "$dir"* "zig-out/lib/$platform/" 2>/dev/null || true
            fi
          done
          # Clean up artifact wrapper dirs
          rm -rf zig-out/lib/binaries-*

      - name: Package .yymps
        working-directory: platforms/gamemaker
        run: |
          chmod +x package-yymps.sh
          ./package-yymps.sh

      - name: Build release notes from CHANGELOG
        working-directory: platforms/gamemaker
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## Colyseus GameMaker SDK v${VERSION}"
            echo
            # Extract the section for this version from CHANGELOG.md (stops at the next "## " heading or EOF)
            awk -v ver="${VERSION}" '
              $0 == "## " ver { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "### Installation"
            echo "1. Download \`colyseus-gamemaker-${VERSION}.yymps\`"
            echo "2. In GameMaker, go to **Tools → Import Local Package**"
            echo "3. Select the \`.yymps\` file, select all resources, and click **Import**"
            echo
            echo "### Supported Platforms"
            echo "- Windows (x86_64)"
            echo "- macOS (arm64, x86_64)"
            echo "- iOS (arm64)"
            echo "- Linux (x86_64)"
            echo "- Android (arm64, arm32, x86_64)"
            echo "- HTML5 (WASM)"
          } > "${NOTES_FILE}"
          echo "notes_path=${NOTES_FILE}" >> "$GITHUB_ENV"
          echo "--- Release notes ---"
          cat "${NOTES_FILE}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gamemaker-v${{ needs.check-version.outputs.version }}
          name: GameMaker SDK v${{ needs.check-version.outputs.version }}
          body_path: ${{ env.notes_path }}
          files: platforms/gamemaker/package-out/colyseus-gamemaker-${{ needs.check-version.outputs.version }}.yymps
          draft: false
          prerelease: ${{ contains(needs.check-version.outputs.version, 'alpha') || contains(needs.check-version.outputs.version, 'beta') || contains(needs.check-version.outputs.version, 'rc') }}
